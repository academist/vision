name: build
on: [pull_request]
jobs:
  code_analysis:
    name: code_analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ['3.4']
    steps:
      - uses: actions/checkout@v3
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: cache vendor/bundle
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: bundle-${{ runner.os }}-ruby-${{ matrix.ruby }}-${{ hashFiles('Gemfile', 'vision.gemspec', '**/Gemfile.lock') }}
      - name: bundle install
        run: |
          bundle config set --local path vendor/bundle
          bundle check || bundle install --jobs=4 --retry=3
      - name: Display ruby version
        run: ruby -v
      - name: Display rails version
        run: bundle exec rails -v
      - name: Run rubocop
        run: bundle exec rubocop
      - name: Run haml-lint
        run: bundle exec haml-lint
      - name: Run brakeman
        run: bundle exec brakeman
      - name: Run reek
        run: bundle exec reek
  rspec:
    name: rspec
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.4', '4.0']
        rails: ['7_2']
    env:
      BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.rails }}.gemfile
    steps:
      - uses: actions/checkout@v3
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: cache vendor/bundle
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: bundle-${{ runner.os }}-ruby-${{ matrix.ruby }}-rails-${{ matrix.rails }}-${{ hashFiles('Gemfile', 'vision.gemspec', 'gemfiles/*.gemfile', '**/Gemfile.lock') }}
      - name: bundle install
        run: |
          bundle config set --local path vendor/bundle
          bundle check || bundle install --jobs=4 --retry=3
      - name: Display ruby version
        run: ruby -v
      - name: Display rails version
        run: bundle exec rails -v
      - name: Run rspec
        run: bundle exec rspec
